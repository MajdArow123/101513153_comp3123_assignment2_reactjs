# nginx settings for the React app inside the frontend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    # React Router handles URLs like /employees/123 in the browser. There is no such file
    # on disk, so for any path that isn't a real file we return index.html and let React
    # show the right page. Without this, refreshing a deep link would give a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS files have a hash in their name (e.g. index-a1b2c3.js), so they can be
    # cached for a long time: a new build produces new file names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
